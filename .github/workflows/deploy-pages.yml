name: Build and deploy celebration displays

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC is 06:00 CST / 07:00 CDT. GitHub Actions cron cannot adjust for DST.
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate public celebration data
        env:
          YANKA_BIRTHDAY_ICAL_URL: ${{ secrets.YANKA_BIRTHDAY_ICAL_URL }}
          YANKA_ANNIVERSARY_ICAL_URL: ${{ secrets.YANKA_ANNIVERSARY_ICAL_URL }}
        run: npm run generate:data
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
